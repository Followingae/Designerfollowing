<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{background:transparent}
  body{width:1000px;height:1170px;font-family:'Hanken Grotesk',system-ui,sans-serif;color:#14151A;-webkit-font-smoothing:antialiased;position:relative}
  .deal{position:absolute;left:40px;top:40px;width:760px;height:620px;border-radius:56px;overflow:hidden;background:url('file:///C:/Users/user/Downloads/Sporty%20Duo%20Portrait.png') center 30%/cover;box-shadow:0 60px 90px -50px rgba(40,20,90,.6)}
  .deal:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(24,23,20,.86),transparent 58%)}
  .tag{position:absolute;left:34px;top:34px;background:#181714;color:#fff;font-size:26px;font-weight:700;padding:12px 26px;border-radius:999px;z-index:2}
  .days{position:absolute;right:34px;top:34px;background:#fff;font-size:26px;font-weight:700;padding:12px 24px;border-radius:999px;z-index:2}
  .meta{position:absolute;left:38px;bottom:38px;z-index:2;color:#fff}
  .brand{font-size:28px;opacity:.72}
  .title{font-family:Archivo,sans-serif;font-weight:700;font-size:54px;letter-spacing:-.02em;line-height:1.05;margin-top:6px;width:420px}
  .pay{position:absolute;right:34px;bottom:40px;z-index:2;background:#CDFF3A;color:#181714;font-family:Archivo,sans-serif;font-weight:800;font-size:36px;padding:16px 30px;border-radius:999px}
  .wallet{position:absolute;right:20px;top:636px;width:600px;background:#fff;border-radius:52px;padding:44px 44px 40px;box-shadow:0 60px 90px -50px rgba(40,20,90,.7)}
  .wallet small{font-size:26px;color:#565D6B;font-weight:500}
  .amt{font-family:Archivo,sans-serif;font-weight:800;font-size:110px;letter-spacing:-.035em;line-height:1.05;margin-top:6px}
  .amt span{font-size:40px;font-weight:700;color:#969CA8;margin-right:14px;letter-spacing:0}
  .btn{margin-top:30px;height:100px;border-radius:30px;background:#CDFF3A;color:#181714;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center}
</style></head>
<body>
  <div class="deal">
    <span class="tag">Paid</span><span class="days">5d</span>
    <div class="meta"><div class="brand">Urban Clothing</div><div class="title">Summer activewear drop</div></div>
    <span class="pay">AED 1,500</span>
  </div>
  <div class="wallet"><small>Total balance</small><div class="amt"><span>AED</span>7,500</div><div class="btn">Withdraw</div></div>
</body></html>
