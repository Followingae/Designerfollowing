<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{background:transparent}
  body{width:1240px;height:900px;font-family:Inter,system-ui,sans-serif;color:#171717;-webkit-font-smoothing:antialiased;position:relative}
  .card{position:absolute;background:#fff;border:2px solid #DFDFDF;border-radius:30px;box-shadow:0 50px 80px -46px rgba(40,30,0,.55)}
  .main{left:40px;top:40px;width:1040px;padding:52px 56px 56px}
  h1{font-size:46px;font-weight:600;letter-spacing:-.025em}
  .sub{font-size:24px;color:#707070;margin-top:10px}
  .pills{display:inline-flex;gap:6px;background:#EDEDED;border-radius:999px;padding:7px;margin-top:34px}
  .pills span{font-size:22px;font-weight:500;padding:10px 24px;border-radius:999px;color:#707070}
  .pills .on{background:#fff;color:#171717;font-weight:600}
  .over{font-size:20px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#707070;margin-top:50px}
  .figs{display:flex;gap:70px;margin-top:22px}
  .fig small{display:block;font-size:24px;color:#707070}
  .fig b{display:block;font-size:104px;font-weight:600;letter-spacing:-.04em;line-height:1.08}
  .fig i{font-style:normal;font-size:20px;color:#707070}
  .who{right:0;top:560px;width:760px;padding:30px 34px;display:flex;align-items:center;gap:24px}
  .av{width:104px;height:104px;border-radius:50%;background:url('file:///C:/Users/user/Downloads/Sporty%20Duo%20Portrait.png') 34% 22%/330% auto}
  .nm{font-size:32px;font-weight:600;letter-spacing:-.02em}
  .un{font-size:23px;color:#707070;margin-top:4px}
  .st{margin-left:auto;background:#C9A7F9;color:#1E2723;font-size:22px;font-weight:600;padding:12px 26px;border-radius:999px}
</style></head>
<body>
  <div class="card main">
    <h1>How this campaign performed</h1>
    <div class="sub">Counted across every post on this campaign.</div>
    <div class="pills"><span>7 days</span><span class="on">30 days</span><span>90 days</span><span>All time</span></div>
    <div class="over">Overview</div>
    <div class="figs">
      <div class="fig"><small>Combined followers</small><b>2.4M</b></div>
      <div class="fig"><small>Video plays</small><b>1.8M</b></div>
      <div class="fig"><small>Engagement rate</small><b>4.6%</b><i>Campaign average</i></div>
    </div>
  </div>
  <div class="card who"><div class="av"></div><div><div class="nm">Sara Al Amiri</div><div class="un">3 posts &nbsp;·&nbsp; 5.20% engagement</div></div><div class="st">Active</div></div>
</body></html>
