<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{background:transparent}
  body{width:1000px;height:1040px;font-family:'Hanken Grotesk',system-ui,sans-serif;color:#131313;-webkit-font-smoothing:antialiased;position:relative}
  .card{position:absolute;left:60px;top:50px;width:820px;background:#fff;border-radius:52px;padding:46px 46px 40px;box-shadow:0 60px 90px -50px rgba(20,10,60,.6)}
  .note{display:inline-flex;align-items:center;gap:14px;background:#F3F3F1;border-radius:999px;padding:12px 24px 12px 14px;font-size:22px;font-weight:600;color:#5A5A55}
  .dot{width:34px;height:34px;border-radius:50%;background:#131313}
  .lab{font-size:22px;font-weight:700;color:#A3A29C;margin-top:40px;letter-spacing:.01em}
  .msg{font-size:64px;font-weight:700;letter-spacing:-.035em;line-height:1.04;margin-top:12px}
  .shot{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:2px solid #F3F3F1;font-size:32px;font-weight:600;letter-spacing:-.02em}
  .shot span{font-size:22px;font-weight:800;color:#A3A29C}
  .tags{display:flex;gap:12px;margin-top:30px}
  .tag{background:#F3F3F1;border-radius:999px;padding:12px 22px;font-size:22px;font-weight:700}
  .btn{margin-top:34px;height:96px;border-radius:999px;background:#131313;color:#fff;font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .pill{position:absolute;right:0;top:0;background:#131313;color:#fff;border-radius:999px;padding:20px 34px;font-size:26px;font-weight:700;box-shadow:0 30px 50px -26px rgba(20,10,60,.7)}
</style></head>
<body>
  <div class="card">
    <div class="note"><span class="dot"></span>AI drafted this. Tap any field to edit.</div>
    <div class="lab">Key message</div>
    <div class="msg">One serum, whole routine, glow in 7 days.</div>
    <div class="lab">Shot list</div>
    <div class="shot">Unboxing in morning light<span>01</span></div>
    <div class="shot">Texture close-up on skin<span>02</span></div>
    <div class="shot">Before and after glow<span>03</span></div>
    <div class="btn">Use this brief</div>
  </div>
  <div class="pill">Regenerate</div>
</body></html>
