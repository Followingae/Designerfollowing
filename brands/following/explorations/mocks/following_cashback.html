<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{background:transparent}
  body{width:1000px;height:1080px;font-family:'Hanken Grotesk',system-ui,sans-serif;color:#14151A;-webkit-font-smoothing:antialiased;position:relative}
  .deal{position:absolute;left:120px;top:40px;width:760px;height:560px;border-radius:56px;overflow:hidden;background:url('file:///C:/Users/user/Desktop/NEWFOLLOWINGWEBSITE/ASSETS/INSDUSTRY%20PAGES/Woman%20Enjoying%20Burger.png') center 22%/cover;box-shadow:0 60px 90px -50px rgba(0,0,60,.7)}
  .deal:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(24,23,20,.86),transparent 58%)}
  .tag{position:absolute;left:34px;top:34px;background:#CDFF3A;color:#181714;font-size:26px;font-weight:700;padding:12px 26px;border-radius:999px;z-index:2}
  .meta{position:absolute;left:38px;bottom:38px;z-index:2;color:#fff}
  .brand{font-size:28px;opacity:.72}
  .title{font-family:Archivo,sans-serif;font-weight:700;font-size:54px;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
  .pay{position:absolute;right:34px;bottom:40px;z-index:2;background:#CDFF3A;color:#181714;font-family:Archivo,sans-serif;font-weight:800;font-size:36px;padding:16px 30px;border-radius:999px}
  .act{position:absolute;left:20px;top:576px;width:700px;background:#fff;border-radius:52px;padding:36px 44px 20px;box-shadow:0 60px 90px -50px rgba(0,0,60,.8)}
  .act h3{font-family:Archivo,sans-serif;font-size:34px;font-weight:700;letter-spacing:-.01em}
  .row{display:flex;align-items:center;gap:22px;padding:28px 0;border-top:2px solid #EEF0F3;font-size:32px;font-weight:600}
  .row:first-of-type{border-top:0;margin-top:8px}
  .row b{font-family:Archivo,sans-serif;font-weight:800;margin-left:auto}
  .pill{font-size:23px;font-weight:700;padding:9px 22px;border-radius:999px;color:#fff}
  .pending{background:#FFB800;color:#181714}.paid{background:#0A84FF}
</style></head>
<body>
  <div class="deal">
    <span class="tag">Cashback</span>
    <div class="meta"><div class="brand">The Burger Room</div><div class="title">Post your visit</div></div>
    <span class="pay">20% back</span>
  </div>
  <div class="act"><h3>Activity</h3>
    <div class="row"><span class="pill pending">Pending</span>In hold<b>AED 35</b></div>
    <div class="row"><span class="pill paid">Paid</span>Post verified<b>AED 35</b></div>
  </div>
</body></html>
